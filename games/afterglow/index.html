<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFTERGLOW — A Tour with the Ashfall Players</title>
  <meta name="description" content="A narrative action-adventure in a world where the sun has gone quiet. Four former soldiers, one lantern, and a tour to make the dark pay cover.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="frame">
    <canvas id="game" width="960" height="540" aria-label="AFTERGLOW game canvas"></canvas>
    <div id="loading">
      <div class="l-title">AFTERGLOW</div>
      <div class="l-sub">warming the lantern…</div>
    </div>
  </div>
  <noscript>
    <p style="color:#cbd5e1;font-family:Georgia,serif;text-align:center;padding:2rem">
      AFTERGLOW needs JavaScript. The dark, regrettably, does not.
    </p>
  </noscript>
  <script type="module">
    import { boot } from './src/main.js';
    const app = boot();
    if (app) document.getElementById('loading')?.remove();
    window.addEventListener('error', e => {
      const el = document.getElementById('loading');
      if (el && !window.__afterglow) el.innerHTML = '<div class="l-title">the lantern failed to light</div><div class="l-sub">' + (e.message || 'unknown error') + '</div>';
    });
  </script>
</body>
</html>
