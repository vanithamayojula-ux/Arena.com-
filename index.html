<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Arcade — Play Everything</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f1a'/%3E%3Cpath d='M10 8l12 8-12 8z' fill='%2322d3ee'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0f1a;
    --bg2: #101827;
    --panel: #141c2e;
    --line: rgba(148, 163, 184, 0.16);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --accent2: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 500px at 80% -10%, rgba(167, 139, 250, 0.14), transparent 60%),
      radial-gradient(900px 500px at 10% -10%, rgba(34, 211, 238, 0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(10px);
    background: rgba(11, 15, 26, 0.78);
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    font-size: 18px;
  }
  .logo .badge {
    width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #06121a; font-size: 16px;
  }
  .logo span em { color: var(--accent); font-style: normal; }
  .spacer { flex: 1; }
  #search {
    width: min(340px, 60vw);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--text);
    outline: none;
    font-size: 14px;
  }
  #search:focus { border-color: var(--accent); }

  main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 60px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: 0.15s;
  }
  .chip:hover { color: var(--text); }
  .chip.on {
    color: #06121a;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    font-weight: 700;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
  }
  .thumb {
    height: 140px;
    position: relative;
    display: grid;
    place-items: center;
    color: rgba(255, 255, 255, 0.9);
    font-size: 44px;
  }
  .thumb .play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(6, 10, 18, 0.4);
    opacity: 0;
    transition: 0.16s;
    font-size: 15px;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .card:hover .play { opacity: 1; }
  .card-body { padding: 14px 16px 16px; }
  .card-body h3 { margin: 0 0 4px; font-size: 16px; }
  .card-body p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .tag.engine { color: var(--accent); border-color: rgba(34, 211, 238, 0.4); }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* in-hub player */
  #player {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    background: rgba(4, 7, 12, 0.92);
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  #player.open { display: flex; flex-direction: column; }
  .player-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .player-bar h2 { margin: 0; font-size: 17px; flex: 1; }
  .pbtn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .pbtn:hover { border-color: var(--accent); }
  #player iframe {
    flex: 1;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #000;
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="badge">&#9654;</div><span>ARENA <em>ARCADE</em></span></div>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Search games&hellip;" autocomplete="off" />
</header>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches that search.</div>
</main>

<div id="player">
  <div class="player-bar">
    <h2 id="player-title">Game</h2>
    <button class="pbtn" id="player-open" title="Open in a new tab">&#8599; New tab</button>
    <button class="pbtn" id="player-close">Close &#10005;</button>
  </div>
  <iframe id="player-frame" allow="fullscreen; autoplay; gamepad" title="Game"></iframe>
</div>

<script>
  // Registry — add a game here and it appears in the hub automatically.
  const GAMES = [
    {
      id: "apex",
      title: "APEX — The Cretaceous Chase",
      desc: "Run the herds down as a tyrannosaur. Stamina-based chases, rival raptors, wave quotas.",
      dir: "games/apex",
      entry: "index.html",
      engine: "Canvas 2D",
      emoji: "🦖",
      tint: ["#3f5c30", "#6f7a3f"],
      tags: ["action", "arcade", "survival"],
    },
  ];

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const filtersEl = document.getElementById("filters");
  const search = document.getElementById("search");
  const player = document.getElementById("player");
  const frame = document.getElementById("player-frame");
  const ptitle = document.getElementById("player-title");

  let activeTag = "all";

  const allTags = ["all", ...new Set(GAMES.flatMap((g) => g.tags))];
  filtersEl.innerHTML = allTags
    .map((t) => `<button class="chip${t === "all" ? " on" : ""}" data-tag="${t}">${t}</button>`)
    .join("");

  function current() {
    const q = search.value.trim().toLowerCase();
    return GAMES.filter((g) => {
      const tagOk = activeTag === "all" || g.tags.includes(activeTag);
      const qOk =
        !q ||
        g.title.toLowerCase().includes(q) ||
        g.desc.toLowerCase().includes(q) ||
        g.tags.some((t) => t.includes(q));
      return tagOk && qOk;
    });
  }

  function render() {
    const list = current();
    empty.hidden = list.length !== 0;
    grid.innerHTML = list
      .map(
        (g) => `
      <div class="card" data-id="${g.id}" role="button" tabindex="0">
        <div class="thumb" style="background:linear-gradient(135deg, ${g.tint[0]}, ${g.tint[1]})">
          <span>${g.emoji}</span>
          <div class="play">PLAY &#9654;</div>
        </div>
        <div class="card-body">
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <div class="meta">
            <span class="tag engine">${g.engine}</span>
            ${g.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
          </div>
        </div>
      </div>`
      )
      .join("");
  }

  function openGame(g) {
    ptitle.textContent = g.title;
    frame.src = `${g.dir}/${g.entry}`;
    player.classList.add("open");
  }
  function closeGame() {
    player.classList.remove("open");
    frame.src = "about:blank";
  }

  grid.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    openGame(GAMES.find((g) => g.id === card.dataset.id));
  });
  grid.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest(".card");
    if (card) openGame(GAMES.find((g) => g.id === card.dataset.id));
  });

  filtersEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    activeTag = chip.dataset.tag;
    filtersEl.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    render();
  });

  search.addEventListener("input", render);
  document.getElementById("player-close").addEventListener("click", closeGame);
  document.getElementById("player-open").addEventListener("click", () => {
    const g = GAMES.find((x) => x.title === ptitle.textContent);
    if (g) window.open(`${g.dir}/${g.entry}`, "_blank");
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && player.classList.contains("open")) closeGame();
  });

  render();
</script>
</body>
</html>
